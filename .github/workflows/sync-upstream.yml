# Keeps this fork's main in step with growthenginenowoslawski/coldoutboundskills.
# Fast-forwards when possible, merge-commits when the fork has its own commits,
# and fails (GitHub emails the owner) on a real conflict — resolve that locally.
name: Sync fork with upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into fork main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
